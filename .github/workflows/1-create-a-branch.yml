name: Step 1 # Create a branch

# Checks if the learner completed tasks for step 1.
# - Triggers when the user creates a new branch 'my-first-branch'.
# - Checks that the branch name is 'my-first-branch'.
# - If all checks pass, the workflow is disabled so it doesn't run again. As such, workflow status badge will change to green.
# - Also handles automated setup when triggered from the copilot agent branch.

on:
  push:
    branches:
      - "my-first-branch"
      - "copilot/introduction-to-github-exercise"

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

env:
  STEP_2_FILE: ".github/steps/2-commit-a-file.md"
  STEP_3_FILE: ".github/steps/3-open-a-pull-request.md"
  STEP_4_FILE: ".github/steps/4-merge-your-pull-request.md"
  REVIEW_FILE: ".github/steps/x-review.md"

jobs:
  setup_exercise:
    name: Setup exercise branch and complete all steps
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/copilot/introduction-to-github-exercise'
    outputs:
      pr-number: ${{ steps.create-pr.outputs.pr-number }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure git
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create my-first-branch with PROFILE.md
        run: |
          git checkout -b my-first-branch
          echo "Welcome to my GitHub profile!" > PROFILE.md
          git add PROFILE.md
          git commit -m "Add PROFILE.md"
          git push origin my-first-branch --force

      - name: Create pull request
        id: create-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head my-first-branch \
            --title "Add my first file" \
            --body "Adding PROFILE.md as part of the Introduction to GitHub exercise. This file introduces the GitHub profile README concept." \
            2>/dev/null || gh pr list --head my-first-branch --json number --jq '.[0].number | "https://github.com/${{ github.repository }}/pull/\(.)"')
          PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          echo "pr-number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "PR number: $PR_NUMBER"

  find_exercise_for_setup:
    name: Find Exercise Issue (setup)
    needs: [setup_exercise]
    if: github.ref == 'refs/heads/copilot/introduction-to-github-exercise'
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.7.0

  complete_all_steps:
    name: Complete all exercise steps
    needs: [setup_exercise, find_exercise_for_setup]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/copilot/introduction-to-github-exercise'
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise_for_setup.outputs.issue-number }}
      PR_NUMBER: ${{ needs.setup_exercise.outputs.pr-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Create comment - step 1 finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2

      - name: Create comment - add step 2 content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_2_FILE }}

      - name: Create comment - step 2 finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 3

      - name: Create comment - add step 3 content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_3_FILE }}

      - name: Create comment - step 3 finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4

      - name: Create comment - add step 4 content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_4_FILE }}

      - name: Merge the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            gh pr merge "$PR_NUMBER" --merge --delete-branch || echo "PR merge failed or already merged"
          else
            echo "No PR number available, skipping merge"
          fi

      - name: Create comment - lesson review
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/lesson-review.md

      - name: Create comment - add review content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.REVIEW_FILE }}

      - name: Update workflow states
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow disable "Step 1" || true
          gh workflow disable "Step 2" || true
          gh workflow disable "Step 3" || true
          gh workflow disable "Step 4" || true

  find_exercise:
    name: Find Exercise Issue
    if: github.ref == 'refs/heads/my-first-branch'
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.7.0

  post_next_step_content:
    name: Post next step content
    needs: [find_exercise]
    if: github.ref == 'refs/heads/my-first-branch'
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get response templates
        uses: actions/checkout@v4
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.7.0

      - name: Create comment - step finished
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 2

      - name: Create comment - add step content
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_2_FILE }}

      - name: Create comment - watching for progress
        uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/watching-for-progress.md

      - name: Disable current workflow and enable next one
        run: |
          gh workflow disable "${{github.workflow}}"
          gh workflow enable "Step 2"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

